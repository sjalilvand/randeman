# سایت مستقل راندمان روی Nginx موجود — پورت داخلی 8087 (سند ۱۵.۲ و ۱۵.۳)
# فایل را در include مسیر Nginx موجود قرار دهید؛ پیش از reload حتماً «nginx -t» اجرا شود.
# Caddy همچنان 80/443 را در اختیار دارد؛ این سایت فقط داخلی است.

server {
    listen      127.0.0.1:8087;
    server_name _;

    root  C:/randeman/releases/v1.0.0/frontend/dist;
    index index.html;

    # سقف بدنه درخواست: ۲۰MB فایل + سربار Multipart (سند ۱۵.۵)
    client_max_body_size 25m;
    client_body_timeout  60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # سربرگ‌های امنیتی (سند ۱۳.۲)
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" always;

    # API
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8011; }
    location = /readyz  { proxy_pass http://127.0.0.1:8011; }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # کش طولانی برای assets نسخه‌دار
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# الگوی همزیستی با Caddy (سند ۱۵.۳) — در Caddyfile:
#
#   randeman.internal.example.ir {
#       reverse_proxy 127.0.0.1:8087
#   }
#
# اعتماد Uvicorn به سربرگ‌های Forwarded فقط برای پراکسی شناخته‌شده (RANDEMAN_TRUSTED_PROXIES) فعال است.
